<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 이미지 요소 -->
    <img src="./images/dog1.jpg" width="300" alt="dog1" title="강아지1" />
    <img src="./images/dog2.jpg" width="300" alt="dog2" />
    <img src="./images/dog3.jpg" width="300" alt="dog3" />
    <img src="./images/dog4.jpg" width="300" alt="dog4" />
    <!-- 인라인블럭은 넓이, 높이를 가질 수 있지만 줄바꿈은 안됨 -->
    <hr />

    <!-- 비디오 태그 -->
    <video autoplay muted loop width="400">
      <source src="./media/son.mp4" />
    </video>
    <video controls width="400">
      <source src="./media/son.mp4" />
    </video>
    <!-- autoplay 자동 재생, muted 음소거일때만 자동이 됨, loop 반복 재생 -->
  </body>
</html>
