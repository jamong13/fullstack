<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        font-size: 60px;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }
      .heading {
        width: 100%;
        height: 200px;
        background-color: #222;
        color: #fff;
        text-align: center;
        /* 가로 가운데 정렬 */
        line-height: 200px;
        /* 세로 가운데 정렬 line-height : 200px 값과 height : 200px 값을 동일 */
      }
    </style>
  </head>
  <body>
    <h1 class="heading">HTML</h1>
  </body>
</html>
