<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* html을 디자인할 수 있다. */
      .box {
        width: 150px; /* 넓이 */
        height: 150px; /* 높이 */
        /* background-color: yellow; */
        /* 박스 4개의 배경색을 다 노란색을 준다. */
      }
      .box1 {
        background-color: lightskyblue;
        padding: 10px;
        /* 안여백 위 10px 오른쪽 10px 아래 10px 왼쪽 10px */
        /* border: 1px solid #000; */
        /* 테두리 : 선두께 실선 색상 */
        border: 1px dashed #000;
        /* dotted 점선 solid 실선 dashed 긴점선 */
      }
      .box2 {
        background-color: lightcoral;
        padding: 10px 20px 30px 40px;
        /* 안여백 위 10px 오른쪽 20px 아래 30px 왼쪽 40px 시계방향*/
      }
      .box3 {
        background-color: aliceblue;
        padding: 10px 20px;
        /* 안여백 위아래 10px 좌우 20px */
      }
      .box4 {
        background-color: lemonchiffon;
        padding: 10px 20px 30px;
        /* 안여백 위 10px 좌우 20px 아래 30px */
      }
    </style>
  </head>
  <body>
    <!-- div : division 구역 -->
    <!-- 클래스 별명 - box 이면서  box1 이름도 된다. -->
    <!-- 스타일에서 클래스에 효과를 주려면 . 을 앞에 써준다. -->
    <div class="box box1">박스1</div>
    <div class="box box2">박스2</div>
    <div class="box box3">박스3</div>
    <div class="box box4">박스4</div>
  </body>
</html>
