<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border: 1px solid #333;
        border-collapse: collapse;
        margin-left: auto;
        margin-right: auto;
        margin-top: 20px;
      }
      td {
        border: 1px solid #333;
        padding: 5px 10px;
      }
      .tit_img {
        background-image: url(./images/abc.png);
        background-repeat: no-repeat;
        background-position: 50% 50%;
        background-size: cover;
      }
      .title {
        font-weight: bold;
        background-color: #f5f5f5;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <table border="1">
      <colgroup>
        <col style="width: 150px" />
        <col style="width: 150px" />
        <col style="width: 420px" />
      </colgroup>
      <tr>
        <td rowspan="5" class="tit_img"></td>
        <td class="title">이름</td>
        <td>이희수</td>
      </tr>
      <tr>
        <td class="title">사는 곳</td>
        <td>서울특별시</td>
      </tr>
      <tr>
        <td class="title">경력</td>
        <td>웹·자바 개발 및 웹 퍼블리싱 경력</td>
      </tr>
      <tr>
        <td class="title">전문분야</td>
        <td>Java, Html/CSS, Javascript</td>
      </tr>
      <tr>
        <td class="title">자기소개</td>
        <td>
          웹 퍼블리싱 실무 경험이 있으며, 웹 개발자를 목표로 합니다. <br />
          다양한 경험을 바탕으로 성장해 나가고 싶습니다.
        </td>
      </tr>
    </table>
  </body>
</html>
