<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 960px;
        height: 160px;
        margin: 20px auto;
      }
      .box {
        float: left;
        width: 80px;
        margin-right: 20px;
      }
      .box .sbox1 {
        width: 52px;
        height: 52px;
        background-repeat: no-repeat;
        background-position: 50% 50%;
        background-size: cover;
        margin: 0 auto;
      }
      .box1 .sbox1 {
        background-image: url(./imgs/icon8.png);
      }
      .box2 .sbox1 {
        background-image: url(./imgs/icon6.png);
      }
      .box3 .sbox1 {
        background-image: url(./imgs/icon3.png);
      }
      .box4 .sbox1 {
        background-image: url(./imgs/icon5.png);
      }
      .box5 .sbox1 {
        background-image: url(./imgs/icon4.png);
      }
      .box6 .sbox1 {
        background-image: url(./imgs/icon7.png);
      }
      .box7 .sbox1 {
        background-image: url(./imgs/icon1.png);
      }
      .box8 .sbox1 {
        background-image: url(./imgs/icon2.png);
      }
      .box p {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box box1">
        <div class="sbox1"></div>
        <p>예금</p>
      </div>
      <div class="box box2">
        <div class="sbox1"></div>
        <p>펀드</p>
      </div>
      <div class="box box3">
        <div class="sbox1"></div>
        <p>대출</p>
      </div>
      <div class="box box4">
        <div class="sbox1"></div>
        <p>신탁</p>
      </div>
      <div class="box box5">
        <div class="sbox1"></div>
        <p>ISA</p>
      </div>
      <div class="box box6">
        <div class="sbox1"></div>
        <p>보험/공제</p>
      </div>
      <div class="box box7">
        <div class="sbox1"></div>
        <p>골드</p>
      </div>
      <div class="box box8">
        <div class="sbox1"></div>
        <p>외화예금</p>
      </div>
    </div>
  </body>
</html>
