<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 500px;
        height: 300px;
        border-radius: 10px;
      }
      .grad {
        /* background-color: palegreen; */
        /* background: linear-gradient(to right bottom, blue, white); */
        /* 왼쪽 상단에서 오른쪽 하단 */
        /* background: linear-gradient(45deg, #f00, #fff); */
        /* 45도 각도로 x:0 Y:0 시작해서 색상 들어감 */
        background: linear-gradient(to bottom, white 30%, #06f);
        /* 30% 위치에서 색상이 들어가고 나머지를 지정한 색상으로 채움 */
      }
    </style>
  </head>
  <body>
    <div class="grad"></div>
  </body>
</html>
