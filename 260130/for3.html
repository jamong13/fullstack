<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      for (var dan = 2; dan <= 3; dan++) {
        document.write(dan + "단<br/>");
        for (var i = 1; i <= 9; i++) {
          document.write(dan + "X" + i + "=" + dan * i + "<br/>");
        }
      }
    </script>
  </body>
</html>
